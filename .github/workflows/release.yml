name: Release

# Signs policy.toml and publishes it as release vN. Hosts accept a release only if its
# signature's certificate names this workflow at refs/tags/v<the version inside the file>,
# so this file, and who may push a v* tag, are the whole of the policy's custody (README.md).

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the release
      id-token: write  # keyless signing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Lint, the tag matching the version, the version above the last release's
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo v0)
          python3 bin/lint.py --tag "$GITHUB_REF_NAME" --after "${last#v}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4  # the version infra-core installs on hosts
      - name: Sign
        run: cosign sign-blob --yes --bundle policy.toml.sigstore.json policy.toml
      - name: Verify exactly as a host will
        run: |
          cosign verify-blob --bundle policy.toml.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            policy.toml
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" policy.toml policy.toml.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$GITHUB_REF_NAME" --notes "policy.toml at ${GITHUB_SHA}, signed by this workflow's run for ${GITHUB_REF_NAME}."
