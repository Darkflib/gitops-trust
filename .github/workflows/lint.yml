name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Policy lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Lint, the version above the last release's
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo v0)
          # On main after a release is cut, the version equals the last one; on a PR it must be higher.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then after="${last#v}"; else after=$(( ${last#v} - 1 )); fi
          python3 bin/lint.py --after "$after"
