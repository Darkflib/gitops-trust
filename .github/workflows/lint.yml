name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Policy lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a PR's merge commit and its base, to see if policy.toml changed
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Lint, the version above the last release's
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo v0)
          # A PR that changes policy.toml must raise the version. Any other PR, like main after a
          # release is cut, leaves it equal to the last one.
          after=$(( ${last#v} - 1 ))
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! git diff --quiet HEAD^1 HEAD -- policy.toml; then
            after="${last#v}"
          fi
          python3 bin/lint.py --after "$after"
